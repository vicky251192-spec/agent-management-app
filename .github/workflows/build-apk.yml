name: Build Agent Management APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name agent_management --platforms=android build_app

      - name: Copy app code
        run: run: |
  if [ -f lib/main.dart ]; then
    cp lib/main.dart build_app/lib/main.dart
  elif [ -f main.dart ]; then
    cp main.dart build_app/lib/main.dart
  else
    echo "main.dart file not found"
    exit 1
  fi

      - name: Build APK
        run: |
          cd build_app
          flutter pub add sqflite path flutter_secure_storage bcrypt
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Management-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
