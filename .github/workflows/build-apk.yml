class DailyEntryPage extends StatefulWidget {final Map<String,Object?> agent;const DailyEntryPage({super.key,required this.agent});@override State<DailyEntryPage> createState()=>_DailyEntryPageState();}
class _DailyEntryPageState extends State<DailyEntryPage>{
 final ctrls=List.generate(8,(_)=>TextEditingController());final note=TextEditingController();DateTime date=DateTime.now();bool busy=false;
 final names=['Business Amount (₹)','Activisation','FSP','ABL','LWM Login','Customer OTP','FSP OTP','Advisor QR'];
 Future<void> save()async{final nums=<num>[];for(var i=0;i<8;i++){final n=num.tryParse(ctrls[i].text.trim().isEmpty?'0':ctrls[i].text.trim());if(n==null||n<0){toast(context,'Enter valid non-negative numbers.');return;}nums.add(n);}setState(()=>busy=true);try{await Store.addEntry({'agentId':widget.agent['id'],'entryDate':'${date.year}-${date.month.toString().padLeft(2,'0')}-${date.day.toString().padLeft(2,'0')}','business':nums[0].toDouble(),'activisation':nums[1].toInt(),'fsp':nums[2].toInt(),'abl':nums[3].toInt(),'lwm':nums[4].toInt(),'customerOtp':nums[5].toInt(),'fspOtp':nums[6].toInt(),'advisorQr':nums[7].toInt(),'note':note.text.trim()});if(mounted){toast(context,'Daily entry saved.');Navigator.pop(context);}}catch(e){if(mounted)toast(context,'Could not save: $e');}finally{if(mounted)setState(()=>busy=false);}}
 @override void dispose(){for(final x in ctrls)x.dispose();note.dispose();super.dispose();}
 @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('Daily Business Entry')),body:ListView(padding:const EdgeInsets.all(16),children:[
    Text('Agent: ${widget.agent['agentName']} (${widget.agent['agentCode']})'),
    ListTile(contentPadding:EdgeInsets.zero,title:const Text('Entry Date'),subtitle:Text('${date.year}-${date.month.toString().padLeft(2,'0')}-${date.day.toString().padLeft(2,'0')}'),trailing:const Icon(Icons.calendar_month),onTap:()async{final d=await showDatePicker(context:c,initialDate:date,firstDate:DateTime(2020),lastDate:DateTime(2100));if(d!=null)setState(()=>date=d);}),
    ...List.generate(8,(i)=>Padding(padding:const EdgeInsets.only(bottom:10),child:TextField(controller:ctrls[i],keyboardType:const TextInputType.numberWithOptions(decimal:true),inputFormatters:[FilteringTextInputFormatter.allow(RegExp(r'[0-9.]'))],decoration:InputDecoration(labelText:names[i],border:const OutlineInputBorder())))),
    TextField(controller:note,decoration:const InputDecoration(labelText:'Remarks (optional)',border:OutlineInputBorder())),
    const SizedBox(height:16),FilledButton(onPressed:busy?null:save,child:Text(busy?'Saving...':'SAVE DAILY ENTRY'))
  ]));}

class PerformancePage extends StatefulWidget {final Map<String,Object?> agent;const PerformancePage({super.key,required this.agent});@override State<PerformancePage> createState()=>_PerformancePageState();}
class _PerformancePageState extends State<PerformancePage>{
 String month=monthNow();late Future<Map<String,num>> future;late Future<List<Map<String,Object?>>> rows;
 void load(){future=Store.totals(agentId:widget.agent['id'] as int,month:month);rows=Store.entries(widget.agent['id'] as int,month);}
 @override void initState(){super.initState();load();}
 @override Widget build(BuildContext c)=>Scaffold(appBar:AppBar(title:const Text('Monthly Performance')),body:Column(children:[
