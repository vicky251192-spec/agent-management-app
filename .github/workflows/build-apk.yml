workflow = r'''
name: Build Agent Management APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android Flutter project
        run: flutter create --platforms=android build_app
      - name: Copy app source and dependencies
        run: |
          cp lib/main.dart build_app/lib/main.dart
          cp pubspec.yaml build_app/pubspec.yaml
      - name: Get packages
        working-directory: build_app
        run: flutter pub get
      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Management-V2-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
'''.strip()

readme = r'''
# Agent Management App 2.0 (Android / Offline)

## Features
- Admin login and agent login
- Agent profile: personal and professional details, photo
- Daily business entries
- Monthly totals and daily entry history
- Search agents
- Excel export for the current month
- JSON backup and restore
- SQLite schema migration from the original Version 1 `agents.db`

## Important data migration note
The app keeps the database filename `agents.db` and upgrades schema version 1 to 2. Existing agent IDs, codes, names and password hashes are retained by SQLite's `onUpgrade`. Do not uninstall the old app or clear app data before testing the upgrade. Android may treat this as an update only if the applicationId/package name and signing key match the old APK. The GitHub workflow below creates a new Flutter project and may use a different applicationId/signing key, so installing it as a separate app will NOT automatically see the old app's private database. For the actual upgrade, retain the old Android package ID and signing key, or export/import a backup.

## Build
1. Put `lib/main.dart` and `pubspec.yaml` in the repository root structure.
2. Commit `.github/workflows/build-apk.yml`.
3. Open GitHub > Actions > Build Agent Management APK > Run workflow.
4. Download the `Agent-Management-V2-APK` artifact, extract it, and install the APK.

## First run
If the existing secure admin hash is present in the same app installation, the existing admin password remains. On a fresh install, create a new admin password. Existing agent passwords are kept as bcrypt hashes when database migration runs.

## Important limitations
- This is a single-device offline app. Agents take turns using the same phone.
- Excel export shares the current month's daily report.
- Restore replaces current records; make a backup first.
- Photo files are stored as local file paths. Keep the app's private storage intact.
- The code is a functional starter; test on a copy/backup before using real customer or company data. Avoid storing sensitive customer information without company approval.
'''.strip()

