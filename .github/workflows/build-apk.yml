    Expanded(child:FutureBuilder<Map<String,num>>(future:future,builder:(c,s){if(!s.hasData)return const Center(child:CircularProgressIndicator());final t=s.data!;final labels={'Business (₹)':'business','Activisation':'activisation','FSP':'fsp','ABL':'abl','LWM Login':'lwm','Customer OTP':'customerOtp','FSP OTP':'fspOtp','Advisor QR':'advisorQr'};return ListView(children:[
      ...labels.entries.map((e)=>Card(child:ListTile(title:Text(e.key),trailing:Text(e.key=='Business (₹)'?'₹${t[e.value]!.toStringAsFixed(2)}':'${t[e.value]!.toInt()}',style:const TextStyle(fontWeight:FontWeight.bold))))),
      const Padding(padding:EdgeInsets.all(12),child:Text('Daily Entries',style:TextStyle(fontWeight:FontWeight.bold,fontSize:18))),
      FutureBuilder<List<Map<String,Object?>>>(future:rows,builder:(c,r){if(!r.hasData)return const Center(child:CircularProgressIndicator());return Column(children:r.data!.map((x)=>ListTile(title:Text('${x['entryDate']} • ₹${x['business']}'),subtitle:Text('Act ${x['activisation']} | FSP ${x['fsp']} | ABL ${x['abl']} | LWM ${x['lwm']} | OTP ${x['customerOtp']}/${x['fspOtp']} | QR ${x['advisorQr']}'))).toList());})
    ]);}))
  ]));}
}
